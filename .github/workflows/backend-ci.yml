name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:
    inputs:
      checkout_ref:
        description: 'Ref to test when called by a release workflow'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  shell:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - name: Check deployment scripts
        run: |
          /bin/bash -n deploy/apple-container.sh
          /bin/bash deploy/tests/apple-container-test.sh
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/docker-compose-gateway-env-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.0'
      - name: Unit tests
        working-directory: backend
        run: make test-unit
      - name: Integration tests
        working-directory: backend
        run: make test-integration

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend typecheck and critical vitest
        run: make test-frontend

  points-system:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: points_test
          POSTGRES_PASSWORD: points_test
          POSTGRES_DB: points_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U points_test -d points_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      POINTS_TEST_DATABASE_URL: postgres://points_test:points_test@127.0.0.1:5432/points_test?sslmode=disable
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: points-system/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: points-system/go.sum
      - name: Validate shared PostgreSQL bootstrap templates
        run: |
          set -euo pipefail
          psql=(docker run --rm --network host -i -e PGPASSWORD=points_test postgres:16-alpine \
            psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U points_test -d points_test)

          printf '%s\n' \
            'CREATE TABLE public.users (' \
            '  id BIGINT PRIMARY KEY, email TEXT, username TEXT NOT NULL,' \
            '  deleted_at TIMESTAMPTZ, balance BIGINT NOT NULL DEFAULT 0,' \
            '  password_hash TEXT' \
            ');' \
            'CREATE TABLE public.usage_logs (' \
            '  id BIGINT PRIMARY KEY, user_id BIGINT NOT NULL, billing_type INTEGER NOT NULL,' \
            '  actual_cost NUMERIC(20,10) NOT NULL, created_at TIMESTAMPTZ NOT NULL' \
            ');' | "${psql[@]}"

          bash points-system/deploy/ci/shared-database-users-email-acl-test.sh

          {
            cat <<'PSQL_VARS'
          \set points_app_role 'points_ci_app'
          \set points_app_password 'points_ci_app_password'
          \set points_schema 'points_ci'
          PSQL_VARS
            cat points-system/deploy/shared-database-bootstrap.sql.example
          } | "${psql[@]}"

          {
            cat <<'PSQL_VARS'
          \set points_usage_role 'points_ci_reader'
          \set points_usage_password 'points_ci_reader_password'
          PSQL_VARS
            cat points-system/deploy/usage-reader.sql.example
          } | "${psql[@]}"

          cat <<'SQL' | "${psql[@]}"
          DO $audit$
          BEGIN
            IF EXISTS (
              SELECT 1 FROM pg_roles
              WHERE rolname IN ('points_ci_app','points_ci_reader')
                AND (rolsuper OR rolcreatedb OR rolcreaterole OR rolreplication OR rolbypassrls OR rolinherit)
            ) THEN
              RAISE EXCEPTION 'bootstrap role attributes are not minimal';
            END IF;
            IF NOT has_column_privilege('points_ci_reader','public.usage_logs','id','SELECT') OR
               NOT has_column_privilege('points_ci_reader','public.usage_logs','user_id','SELECT') OR
               NOT has_column_privilege('points_ci_reader','public.usage_logs','billing_type','SELECT') OR
               NOT has_column_privilege('points_ci_reader','public.usage_logs','actual_cost','SELECT') OR
               NOT has_column_privilege('points_ci_reader','public.usage_logs','created_at','SELECT') OR
               has_table_privilege('points_ci_reader','public.usage_logs','INSERT') OR
               has_table_privilege('points_ci_app','public.usage_logs','SELECT') THEN
              RAISE EXCEPTION 'bootstrap relation privileges are not isolated';
            END IF;
          END
          $audit$;
          SQL
      - name: Test, vet, and compile independent points service
        working-directory: points-system
        run: |
          go test ./... -count=1
          go vet ./...
          go build ./cmd/server
      - name: PostgreSQL transaction and concurrency tests
        working-directory: points-system
        run: go test -tags=integration ./internal/store -count=1

  video-edge-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Test opaque video delivery worker
        working-directory: deploy/video-edge-worker
        run: npm test

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.0'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
          args: --timeout=30m
          working-directory: backend
