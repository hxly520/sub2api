name: Cachecompat Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version tag to publish'
        required: true
        default: '0.1.149'
        type: string
      publish_latest:
        description: 'Also publish latest tag'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

jobs:
  build:
    name: Build fork image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Prepare image metadata
        id: meta
        env:
          VERSION: ${{ inputs.version }}
          PUBLISH_LATEST: ${{ inputs.publish_latest }}
        run: |
          set -euo pipefail

          owner_lc="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          short_sha="${GITHUB_SHA::12}"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          tags=(
            "ghcr.io/${owner_lc}/sub2api:${VERSION}"
            "ghcr.io/${owner_lc}/sub2api:${VERSION}-${short_sha}"
          )

          if [ "${PUBLISH_LATEST}" = "true" ]; then
            tags+=("ghcr.io/${owner_lc}/sub2api:latest")
          fi

          if [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
            tags+=(
              "${DOCKERHUB_USERNAME}/sub2api:${VERSION}"
              "${DOCKERHUB_USERNAME}/sub2api:${VERSION}-${short_sha}"
            )
            if [ "${PUBLISH_LATEST}" = "true" ]; then
              tags+=("${DOCKERHUB_USERNAME}/sub2api:latest")
            fi
          fi

          {
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
            echo "primary=ghcr.io/${owner_lc}/sub2api:${VERSION}-${short_sha}"
            echo "date=${build_date}"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=sub2api
            org.opencontainers.image.description=Sub2API compatibility fork
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
          build-args: |
            VERSION=${{ inputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.meta.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test published image
        run: |
          set -euo pipefail
          docker pull "${{ steps.meta.outputs.primary }}"
          docker run --rm --entrypoint /app/sub2api "${{ steps.meta.outputs.primary }}" -version

      - name: Build summary
        run: |
          {
            echo "## Published image tags"
            echo
            printf '%s\n' "${{ steps.meta.outputs.tags }}" | sed 's/^/- `/' | sed 's/$/`/'
          } >> "${GITHUB_STEP_SUMMARY}"
