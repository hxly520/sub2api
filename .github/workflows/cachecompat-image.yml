name: Cachecompat Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version guard; must match backend/cmd/server/VERSION'
        required: false
        default: ''
        type: string
      publish_latest:
        description: 'Also publish latest tag'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: cachecompat-image-main
  cancel-in-progress: false

jobs:
  build:
    name: Build fork image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare image metadata
        id: meta
        env:
          VERSION_GUARD: ${{ inputs.version }}
          PUBLISH_LATEST: ${{ inputs.publish_latest }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_ENABLED: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < backend/cmd/server/VERSION)"
          if [ -z "${version}" ]; then
            echo "backend/cmd/server/VERSION is empty" >&2
            exit 1
          fi
          if [ -n "${VERSION_GUARD:-}" ] && [ "${VERSION_GUARD}" != "${version}" ]; then
            echo "Requested version ${VERSION_GUARD} does not match source VERSION ${version}" >&2
            exit 1
          fi

          owner_lc="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          short_sha="${GITHUB_SHA::12}"
          build_date="$(git show -s --format=%cI "${GITHUB_SHA}")"

          tags=(
            "ghcr.io/${owner_lc}/sub2api:${version}"
            "ghcr.io/${owner_lc}/sub2api:${version}-${short_sha}"
          )

          if [ "${PUBLISH_LATEST}" = "true" ]; then
            tags+=("ghcr.io/${owner_lc}/sub2api:latest")
          fi

          if [ "${DOCKERHUB_ENABLED}" = "true" ]; then
            tags+=(
              "${DOCKERHUB_USERNAME}/sub2api:${version}"
              "${DOCKERHUB_USERNAME}/sub2api:${version}-${short_sha}"
            )
            if [ "${PUBLISH_LATEST}" = "true" ]; then
              tags+=("${DOCKERHUB_USERNAME}/sub2api:latest")
            fi
          fi

          {
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
            echo "primary=ghcr.io/${owner_lc}/sub2api:${version}-${short_sha}"
            echo "local=sub2api-validation:${short_sha}"
            echo "version=${version}"
            echo "date=${build_date}"
            echo "dockerhub_enabled=${DOCKERHUB_ENABLED}"
          } >> "${GITHUB_OUTPUT}"

      - name: Build image locally
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.local }}
          labels: |
            org.opencontainers.image.title=sub2api
            org.opencontainers.image.description=Sub2API compatibility fork
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.meta.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test local image
        env:
          IMAGE: ${{ steps.meta.outputs.local }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          output="$(docker run --rm --entrypoint /app/sub2api "${IMAGE}" -version 2>&1)"
          printf '%s\n' "${output}"
          grep -Fq "Sub2API ${VERSION} " <<< "${output}"
          grep -Fq "commit: ${GITHUB_SHA}," <<< "${output}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub
        if: steps.meta.outputs.dockerhub_enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish verified image
        id: publish
        env:
          IMAGE: ${{ steps.meta.outputs.local }}
          PRIMARY: ${{ steps.meta.outputs.primary }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -n "${tag}" ] || continue
            docker tag "${IMAGE}" "${tag}"
            docker push "${tag}"
          done <<< "${TAGS}"

          digest="sha256:$(docker buildx imagetools inspect "${PRIMARY}" --raw | sha256sum | awk '{print $1}')"
          if ! [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid published digest: ${digest}" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Build summary
        run: |
          {
            echo "## Published image tags"
            echo
            printf '%s\n' "${{ steps.meta.outputs.tags }}" | sed 's/^/- `/' | sed 's/$/`/'
            echo
            echo "Digest: \`${{ steps.publish.outputs.digest }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
