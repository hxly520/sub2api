name: Release

on:
  push:
    tags:
      - 'v*-52t.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing private tag to release (for example v0.1.183-52t.1)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  validate-release-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Validate tag and default branch lineage
        shell: bash
        env:
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          tag="${TAG_NAME}"
          bash tools/release/validate-private-tag.sh "${tag}"
          TAG_COMMIT="$(git rev-parse "${tag}^{commit}")"
          git fetch --no-tags origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          DEFAULT_COMMIT="$(git rev-parse "refs/remotes/origin/${DEFAULT_BRANCH}")"

          if git merge-base --is-ancestor "${DEFAULT_COMMIT}" "${TAG_COMMIT}"; then
            echo "Release tag descends from the default branch and can be published safely."
          elif git merge-base --is-ancestor "${TAG_COMMIT}" "${DEFAULT_COMMIT}"; then
            VERSION=${TAG_NAME#v}
            DEFAULT_VERSION="$(git show "${DEFAULT_COMMIT}:backend/cmd/server/VERSION" | tr -d '\r\n')"
            if [ "${DEFAULT_VERSION}" != "${VERSION}" ]; then
              echo "::error::Release tag is already behind ${DEFAULT_BRANCH}, whose VERSION is ${DEFAULT_VERSION}; refusing an old-tag rerun or VERSION downgrade."
              exit 1
            fi
            echo "Release tag is already contained in the default branch at the same version."
          else
            echo "::error::Release tag ${TAG_NAME} and ${DEFAULT_BRANCH} have diverged; refusing to publish or rewrite the default branch."
            exit 1
          fi

  quality-gate:
    needs: validate-release-source
    uses: ./.github/workflows/backend-ci.yml
    with:
      checkout_ref: ${{ github.event.inputs.tag || github.ref }}

  # The release source must already carry the exact immutable version.
  validate-version:
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Validate private release tag
        env:
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          tag="${TAG_NAME}"
          bash tools/release/validate-private-tag.sh "${tag}"

      - name: Validate VERSION file
        env:
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VERSION=${TAG_NAME#v}
          SOURCE_VERSION=$(tr -d '\r\n' < backend/cmd/server/VERSION)
          if [ "$SOURCE_VERSION" != "$VERSION" ]; then
            echo "::error::Release tag ${TAG_NAME} contains VERSION=${SOURCE_VERSION}, expected ${VERSION}."
            exit 1
          fi
          echo "Validated VERSION file: $VERSION"

      - name: Upload VERSION artifact
        uses: actions/upload-artifact@v7
        with:
          name: version-file
          path: backend/cmd/server/VERSION
          retention-days: 1

  build-frontend:
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Build frontend
        run: pnpm run build
        working-directory: frontend

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: backend/internal/web/dist/
          retention-days: 1

  release:
    needs: [validate-version, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download VERSION artifact
        uses: actions/download-artifact@v8
        with:
          name: version-file
          path: backend/cmd/server/

      - name: Download frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: backend/internal/web/dist/

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum

      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.0'

      # Docker setup for GoReleaser
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch tags with annotations
        run: |
          # 确保获取完整的 annotated tag 信息
          git fetch --tags

      - name: Verify immutable release checkout
        env:
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-parse "${TAG_NAME}^{commit}")"

      - name: Get tag message
        id: tag_message
        env:
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          echo "Processing tag: $TAG_NAME"

          # 获取完整的 tag message（跳过第一行标题）
          TAG_MESSAGE=$(git tag -l --format='%(contents:body)' "$TAG_NAME")

          # 调试输出
          echo "Tag message length: ${#TAG_MESSAGE}"
          echo "Tag message preview:"
          echo "$TAG_MESSAGE" | head -10

          # 使用随机分隔符处理多行内容，避免 tag 正文碰撞固定 EOF。
          DELIMITER="TAG_MESSAGE_$(openssl rand -hex 16)"
          echo "message<<${DELIMITER}" >> "$GITHUB_OUTPUT"
          echo "$TAG_MESSAGE" >> "$GITHUB_OUTPUT"
          echo "${DELIMITER}" >> "$GITHUB_OUTPUT"

      - name: Classify update safety
        id: update_policy
        shell: bash
        env:
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          bash tools/release/classify-update.sh "${TAG_NAME}" > update-manifest.json
          jq . update-manifest.json
          echo "policy=$(jq -r .policy update-manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Set lowercase owner for GHCR
        id: lowercase
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          # Keep release tooling reproducible; bump only after local config and image validation.
          version: 'v2.17.1'
          args: release --clean --skip=validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_MESSAGE: ${{ steps.tag_message.outputs.message }}
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_OWNER_LOWER: ${{ steps.lowercase.outputs.owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || 'skip' }}

      - name: Upload update policy and public static assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          cp deploy/public-landing/index.html public-landing-index.html
          sha256sum public-landing-index.html > public-landing-index.html.sha256
          cp deploy/public-help/index.html public-help-index.html
          sha256sum public-help-index.html > public-help-index.html.sha256
          gh release upload "${TAG_NAME}" \
            update-manifest.json \
            public-landing-index.html \
            public-landing-index.html.sha256 \
            public-help-index.html \
            public-help-index.html.sha256 \
            --clobber

      # Update DockerHub description
      - name: Update DockerHub description
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: peter-evans/dockerhub-description@v5
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/sub2api
          short-description: "Sub2API - AI API Gateway Platform"
          readme-filepath: ./deploy/DOCKER.md

      # Send Telegram notification
      - name: Send Telegram Notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
          TAG_MESSAGE: ${{ steps.tag_message.outputs.message }}
        continue-on-error: true
        run: |
          # 检查必要的环境变量
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram credentials not configured, skipping notification"
            exit 0
          fi

          VERSION=${TAG_NAME#v}
          REPO="${{ github.repository }}"
          GHCR_IMAGE="ghcr.io/${REPO,,}"  # ${,,} converts to lowercase

          # 获取 tag message 内容并转义 Markdown 特殊字符
          TAG_MESSAGE=$(echo "$TAG_MESSAGE" | sed 's/\([_*`\[]\)/\\\1/g')

          # 限制消息长度（Telegram 消息限制 4096 字符，预留空间给头尾固定内容）
          if [ ${#TAG_MESSAGE} -gt 3500 ]; then
            TAG_MESSAGE="${TAG_MESSAGE:0:3500}..."
          fi

          # 构建消息内容
          MESSAGE="🚀 *Sub2API 新版本发布！*"$'\n'$'\n'
          MESSAGE+="📦 版本号: \`${VERSION}\`"$'\n'$'\n'

          # 添加更新内容
          if [ -n "$TAG_MESSAGE" ]; then
            MESSAGE+="${TAG_MESSAGE}"$'\n'$'\n'
          fi

          MESSAGE+="🐳 *Docker 部署:*"$'\n'
          MESSAGE+="\`\`\`bash"$'\n'
          # 根据是否配置 DockerHub 动态生成
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            DOCKER_IMAGE="${DOCKERHUB_USERNAME}/sub2api"
            MESSAGE+="# Docker Hub"$'\n'
            MESSAGE+="docker pull ${DOCKER_IMAGE}:${VERSION}"$'\n'
            MESSAGE+="# GitHub Container Registry"$'\n'
          fi
          MESSAGE+="docker pull ${GHCR_IMAGE}:${VERSION}"$'\n'
          MESSAGE+="\`\`\`"$'\n'$'\n'
          MESSAGE+="🔗 *相关链接:*"$'\n'
          MESSAGE+="• [GitHub Release](https://github.com/${REPO}/releases/tag/${TAG_NAME})"$'\n'
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            MESSAGE+="• [Docker Hub](https://hub.docker.com/r/${DOCKER_IMAGE})"$'\n'
          fi
          MESSAGE+="• [GitHub Packages](https://github.com/${REPO}/pkgs/container/sub2api)"$'\n'$'\n'
          MESSAGE+="#Sub2API #Release #${TAG_NAME//./_}"

          # 发送消息
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg chat_id "${TELEGRAM_CHAT_ID}" \
              --arg text "${MESSAGE}" \
              '{
                chat_id: $chat_id,
                text: $text,
                parse_mode: "Markdown",
                disable_web_page_preview: true
              }')"
