name: Release

on:
  push:
    tags:
      - 'v*-52t.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing private tag to release (e.g., v0.2.1-52t.1)'
        required: true
        type: string
      simple_release:
        description: 'Simple release: only x86_64 GHCR image, skip other artifacts'
        required: false
        type: boolean
        default: false

# 环境变量：合并 workflow_dispatch 输入和 repository variable
# tag push 触发时读取 vars.SIMPLE_RELEASE，workflow_dispatch 时使用输入参数
env:
  SIMPLE_RELEASE: ${{ github.event.inputs.simple_release == 'true' || vars.SIMPLE_RELEASE == 'true' }}
  # Expose only the non-secret Docker Hub username at workflow scope so job
  # `if:` guards can decide whether the optional Docker Hub steps run. The
  # password/token remains step-scoped and is never placed in an expression.
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

permissions:
  contents: write
  packages: write

jobs:
  validate-release-source:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release_source.outputs.release_tag }}
      release_ref: ${{ steps.release_source.outputs.release_ref }}
      release_version: ${{ steps.release_source.outputs.release_version }}
      release_commit: ${{ steps.release_source.outputs.release_commit }}
    steps:
      - name: Validate requested tag format
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-52t\.[0-9]+$ ]]; then
            echo "::error::Private releases require a tag matching vX.Y.Z-52t.N; got ${RELEASE_TAG}."
            exit 1
          fi

      - name: Checkout exact release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Validate immutable tag and VERSION
        id: release_source
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [[ "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" != "tag" ]]; then
            echo "::error::Release tag ${RELEASE_TAG} must be an annotated tag."
            exit 1
          fi

          git fetch --no-tags origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          DEFAULT_COMMIT="$(git rev-parse "refs/remotes/origin/${DEFAULT_BRANCH}")"

          RELEASE_COMMIT="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          CHECKOUT_COMMIT="$(git rev-parse HEAD)"
          if [[ "${CHECKOUT_COMMIT}" != "${RELEASE_COMMIT}" ]]; then
            echo "::error::Checkout ${CHECKOUT_COMMIT} does not match ${RELEASE_TAG} commit ${RELEASE_COMMIT}."
            exit 1
          fi

          RELEASE_VERSION="${RELEASE_TAG#v}"
          SOURCE_VERSION="$(tr -d '\r\n' < backend/cmd/server/VERSION)"
          if [[ "${SOURCE_VERSION}" != "${RELEASE_VERSION}" ]]; then
            echo "::error::Tag ${RELEASE_TAG} contains VERSION=${SOURCE_VERSION}; expected ${RELEASE_VERSION}."
            exit 1
          fi

          if git merge-base --is-ancestor "${DEFAULT_COMMIT}" "${RELEASE_COMMIT}"; then
            echo "Validated tag lineage: ${RELEASE_TAG} descends from ${DEFAULT_BRANCH}."
          elif git merge-base --is-ancestor "${RELEASE_COMMIT}" "${DEFAULT_COMMIT}"; then
            DEFAULT_VERSION="$(tr -d '\r\n' < <(git show "${DEFAULT_COMMIT}:backend/cmd/server/VERSION"))"
            if [[ "${DEFAULT_VERSION}" != "${RELEASE_VERSION}" ]]; then
              echo "::error::Tag ${RELEASE_TAG} is already contained in ${DEFAULT_BRANCH}, but default branch VERSION=${DEFAULT_VERSION}; refusing a stale release."
              exit 1
            fi
            echo "Validated tag lineage: ${RELEASE_TAG} is already contained in ${DEFAULT_BRANCH} at the same version."
          else
            echo "::error::Tag ${RELEASE_TAG} and ${DEFAULT_BRANCH} have diverged; refusing to publish."
            exit 1
          fi

          {
            echo "release_tag=${RELEASE_TAG}"
            echo "release_ref=refs/tags/${RELEASE_TAG}"
            echo "release_version=${RELEASE_VERSION}"
            echo "release_commit=${RELEASE_COMMIT}"
          } >> "$GITHUB_OUTPUT"

          echo "Validated ${RELEASE_TAG} at ${RELEASE_COMMIT} with VERSION=${SOURCE_VERSION}."

  quality-gate:
    needs: validate-release-source
    uses: ./.github/workflows/backend-ci.yml
    with:
      checkout_ref: ${{ needs.validate-release-source.outputs.release_ref }}

  security-gate:
    needs: validate-release-source
    uses: ./.github/workflows/security-scan.yml
    with:
      checkout_ref: ${{ needs.validate-release-source.outputs.release_ref }}

  build-frontend:
    needs: [validate-release-source, quality-gate, security-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-release-source.outputs.release_ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Build frontend
        run: pnpm run build
        working-directory: frontend

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: backend/internal/web/dist/
          retention-days: 1

  release:
    needs: [validate-release-source, quality-gate, security-gate, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.validate-release-source.outputs.release_ref }}

      - name: Download frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: backend/internal/web/dist/

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum

      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.0'

      # Docker setup for GoReleaser
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch tags with annotations
        run: |
          # 确保获取完整的 annotated tag 信息
          git fetch --tags --force

      - name: Recheck immutable release source
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate-release-source.outputs.release_tag }}
          RELEASE_COMMIT: ${{ needs.validate-release-source.outputs.release_commit }}
          RELEASE_VERSION: ${{ needs.validate-release-source.outputs.release_version }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${RELEASE_COMMIT}"
          test "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" = "${RELEASE_COMMIT}"
          test "$(tr -d '\r\n' < backend/cmd/server/VERSION)" = "${RELEASE_VERSION}"

      - name: Get tag message
        id: tag_message
        env:
          TAG_NAME: ${{ needs.validate-release-source.outputs.release_tag }}
        run: |
          set -euo pipefail
          echo "Processing tag: $TAG_NAME"

          # 获取完整的 tag message（跳过第一行标题）
          TAG_MESSAGE=$(git tag -l --format='%(contents:body)' "$TAG_NAME")

          # 调试输出
          echo "Tag message length: ${#TAG_MESSAGE}"
          echo "Tag message preview:"
          echo "$TAG_MESSAGE" | head -10

          # 使用随机分隔符，避免 tag 正文中的固定字符串截断输出。
          DELIMITER="TAG_MESSAGE_$(openssl rand -hex 16)"
          echo "message<<${DELIMITER}" >> "$GITHUB_OUTPUT"
          echo "$TAG_MESSAGE" >> "$GITHUB_OUTPUT"
          echo "${DELIMITER}" >> "$GITHUB_OUTPUT"

      - name: Set lowercase owner for GHCR
        id: lowercase
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          # Pin the release tool so a future GoReleaser change cannot silently
          # alter archive or multi-arch manifest output for a production tag.
          version: 'v2.17.1'
          args: release --clean --skip=validate ${{ env.SIMPLE_RELEASE == 'true' && '--config=.goreleaser.simple.yaml' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_MESSAGE: ${{ steps.tag_message.outputs.message }}
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_OWNER_LOWER: ${{ steps.lowercase.outputs.owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || 'skip' }}

      # Update DockerHub description
      - name: Update DockerHub description
        if: ${{ env.SIMPLE_RELEASE != 'true' && env.DOCKERHUB_USERNAME != '' }}
        uses: peter-evans/dockerhub-description@v5
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/sub2api
          short-description: "Sub2API - AI API Gateway Platform"
          readme-filepath: ./deploy/DOCKER.md

      # Send Telegram notification
      - name: Send Telegram Notification
        if: ${{ env.SIMPLE_RELEASE != 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TAG_NAME: ${{ needs.validate-release-source.outputs.release_tag }}
          TAG_MESSAGE: ${{ steps.tag_message.outputs.message }}
        continue-on-error: true
        run: |
          # 检查必要的环境变量
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram credentials not configured, skipping notification"
            exit 0
          fi

          VERSION=${TAG_NAME#v}
          REPO="${{ github.repository }}"
          GHCR_IMAGE="ghcr.io/${REPO,,}"  # ${,,} converts to lowercase

          # 获取 tag message 内容并转义 Markdown 特殊字符
          TAG_MESSAGE=$(echo "$TAG_MESSAGE" | sed 's/\([_*`\[]\)/\\\1/g')

          # 限制消息长度（Telegram 消息限制 4096 字符，预留空间给头尾固定内容）
          if [ ${#TAG_MESSAGE} -gt 3500 ]; then
            TAG_MESSAGE="${TAG_MESSAGE:0:3500}..."
          fi

          # 构建消息内容
          MESSAGE="🚀 *Sub2API 新版本发布！*"$'\n'$'\n'
          MESSAGE+="📦 版本号: \`${VERSION}\`"$'\n'$'\n'

          # 添加更新内容
          if [ -n "$TAG_MESSAGE" ]; then
            MESSAGE+="${TAG_MESSAGE}"$'\n'$'\n'
          fi

          MESSAGE+="🐳 *Docker 部署:*"$'\n'
          MESSAGE+="\`\`\`bash"$'\n'
          # 根据是否配置 DockerHub 动态生成
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            DOCKER_IMAGE="${DOCKERHUB_USERNAME}/sub2api"
            MESSAGE+="# Docker Hub"$'\n'
            MESSAGE+="docker pull ${DOCKER_IMAGE}:${VERSION}"$'\n'
            MESSAGE+="# GitHub Container Registry"$'\n'
          fi
          MESSAGE+="docker pull ${GHCR_IMAGE}:${VERSION}"$'\n'
          MESSAGE+="\`\`\`"$'\n'$'\n'
          MESSAGE+="🔗 *相关链接:*"$'\n'
          MESSAGE+="• [GitHub Release](https://github.com/${REPO}/releases/tag/${TAG_NAME})"$'\n'
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            MESSAGE+="• [Docker Hub](https://hub.docker.com/r/${DOCKER_IMAGE})"$'\n'
          fi
          MESSAGE+="• [GitHub Packages](https://github.com/${REPO}/pkgs/container/sub2api)"$'\n'$'\n'
          MESSAGE+="#Sub2API #Release #${TAG_NAME//./_}"

          # 发送消息
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg chat_id "${TELEGRAM_CHAT_ID}" \
              --arg text "${MESSAGE}" \
              '{
                chat_id: $chat_id,
                text: $text,
                parse_mode: "Markdown",
                disable_web_page_preview: true
              }')"
