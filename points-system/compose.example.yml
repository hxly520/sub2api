services:
  points-system:
    image: "${POINTS_IMAGE:?POINTS_IMAGE must reference an immutable GHCR digest}"
    restart: unless-stopped
    # The env file must set both the points public origin and the one exact
    # Sub2API parent origin permitted by CSP frame-ancestors.
    env_file: ${POINTS_ENV_FILE:-.env}
    ports:
      - "127.0.0.1:${POINTS_HOST_PORT:-8090}:8090"
    read_only: true
    init: true
    pids_limit: 128
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:8090/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sub2api-readonly

networks:
  sub2api-readonly:
    external: true
    name: ${SUB2API_DOCKER_NETWORK:?SUB2API_DOCKER_NETWORK is required}
